function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}
function shuffleOptions(q) {
    const correctText = q.options[q.correct];
    const shuffled = shuffleArray(q.options);
    return { text: q.text, options: shuffled, correct: shuffled.indexOf(correctText) };
}

let finalScore = 0;

function renderMcq() {
    const c = document.getElementById('mcq-questions');
    c.innerHTML = '';
    if (totalMcq === 0) { c.innerHTML = "<p style='text-align:center;color:#888;'>لا توجد أسئلة اختيار من متعدد.</p>"; return; }

        const card = document.createElement('div');
        card.className = 'question-card';
        let html = '<div class="question-text">' + (idx+1) + '. ' + q.text + '</div><ul class="options">';
        q.options.forEach((opt, i) => {
            const letter = (i + 1);
            html += '<li><input type="radio" name="q'+idx+'" value="'+i+'" id="q'+idx+'_opt'+i+'"><label for="q'+idx+'_opt'+i+'">'+letter+'. '+opt+'</label></li>';
        });
        html += '</ul><div class="feedback" id="fb-'+idx+'"></div>';
        card.innerHTML = html;
        c.appendChild(card);
    });
}
function renderEssay() {

}

function generatePDFBlob(studentName, dateStr) {
    // بناء HTML منفصل لتوليد PDF
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'position:fixed; left:-9999px; top:0; width:800px; padding:40px; background:white; font-family:Arial,sans-serif; direction:rtl;';
    let html = '<h1 style="color:#1e3c72; text-align:center; margin-bottom:10px;">' + EXAM_DATA.title + '</h1>';
    html += '<p style="text-align:center; color:#555; margin-bottom:20px;">' + EXAM_DATA.subtitle + '</p>';
    html += '<div style="background:#eef5ff; padding:15px; border-radius:10px; margin-bottom:20px; border-right:4px solid #2a5298;">';
    html += '<p><strong>👤 اسم الطالب:</strong> ' + studentName + '</p>';
    html += '<p><strong>📅 التاريخ:</strong> ' + dateStr + '</p>';
    html += '<p><strong>🎯 الدرجة:</strong> ' + finalScore + ' / ' + totalMcq + '</p>';
    html += '<p><strong>🟢 الصحيحة:</strong> ' + finalScore + ' | <strong>🔴 الخاطئة:</strong> ' + (totalMcq - finalScore) + '</p>';
    html += '</div>';
    html += '<h2 style="color:#2a5298; border-bottom:2px solid #2a5298; padding-bottom:8px;">🔹 أسئلة الاختيار من متعدد</h2>';

    mcqQuestions.forEach((q, i) => {
        const u = userMcqAnswers[i];
        const uText = u !== -1 ? q.options[u] : 'لم يتم الاختيار';
        const correctText = q.options[q.correct];
        const isCorrect = u === q.correct;
        html += '<div style="margin-bottom:18px; padding:12px; background:#f9f9ff; border-radius:10px; border-right:4px solid '+(isCorrect?'#27ae60':'#e74c3c')+';">';
        html += '<p style="font-weight:bold; color:#1e3c72; margin-bottom:6px;">' + (i+1) + '. ' + q.text + '</p>';
        html += '<p>📌 إجابة الطالب: ' + uText + ' ' + (isCorrect ? '✅' : '❌') + '</p>';
        if (!isCorrect) html += '<p style="color:#27ae60;">✅ الإجابة الصحيحة: ' + correctText + '</p>';
        html += '</div>';
    });

    if (essayQuestions.length > 0) {
        html += '<h2 style="color:#2a5298; border-bottom:2px solid #2a5298; padding-bottom:8px; margin-top:25px;">✍️ الأسئلة المقالية</h2>';
        essayQuestions.forEach((q, i) => {
            html += '<div style="margin-bottom:18px; padding:12px; background:#fff9e6; border-radius:10px; border-right:4px solid #f39c12;">';
            html += '<p style="font-weight:bold; color:#1e3c72; margin-bottom:6px;">سؤال ' + (i+1) + ': ' + q + '</p>';
            html += '<p style="background:white; padding:8px; border-radius:6px;">📝 ' + (userEssayAnswers[i] || 'لم يكتب إجابة') + '</p>';
            html += '</div>';
        });
    }

    wrapper.innerHTML = html;
    document.body.appendChild(wrapper);

    return html2canvas(wrapper, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
        document.body.removeChild(wrapper);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const pdfW = pdf.internal.pageSize.getWidth();
        const pdfH = pdf.internal.pageSize.getHeight();
        const imgW = pdfW - 20;
        const imgH = (canvas.height * imgW) / canvas.width;

        let heightLeft = imgH;
        let position = 10;

        // الصفحة الأولى
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 10, position, imgW, imgH);
        heightLeft -= (pdfH - 20);

        // صفحات إضافية
        while (heightLeft > 0) {
            position = heightLeft - imgH + 10;
            pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 10, position, imgW, imgH);
            heightLeft -= (pdfH - 20);
        }
        return pdf.output('blob');
    });
}

async function sendPDFToTelegram(studentName, pdfBlob, dateStr) {
    const fileName = studentName.replace(/[\\/:*?"<>|]/g, '_') + '_' + Date.now() + '.pdf';
    const caption = '📢 *نتيجة امتحان جديدة*\n\n'
        + '📘 *الامتحان:* ' + EXAM_DATA.title + '\n'
        + '👤 *الطالب:* ' + studentName + '\n'
        + '📅 *التاريخ:* ' + dateStr + '\n'
        + '🎯 *الدرجة:* ' + finalScore + ' / ' + totalMcq + '\n'
        + '🟢 *الصحيحة:* ' + finalScore + ' | 🔴 *الخاطئة:* ' + (totalMcq - finalScore);

    const formData = new FormData();
    formData.append('chat_id', EXAM_DATA.chatId);
    formData.append('document', pdfBlob, fileName);
    formData.append('caption', caption);
    formData.append('parse_mode', 'Markdown');

    try {
        const res = await fetch('https://api.telegram.org/bot' + EXAM_DATA.botToken + '/sendDocument', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        return data.ok;
    } catch(e) { console.error(e); return false; }
}

async function submitExam() {
    if (isSubmitted) return;
    const nameInput = document.getElementById('studentName');
    const studentName = nameInput.value.trim();
    const nameError = document.getElementById('nameError');

    if (studentName === '') {
        nameError.style.display = 'block';
        nameInput.style.border = '2px solid #e74c3c';
        nameInput.scrollIntoView({ behavior:'smooth', block:'center' });
        return;
    }
    nameError.style.display = 'none';
    isSubmitted = true;

    let score = 0;
    userMcqAnswers = [];
    for (let i = 0; i < mcqQuestions.length; i++) {
        const selected = document.querySelector('input[name="q'+i+'"]:checked');
        const fb = document.getElementById('fb-'+i);
        const correctIdx = mcqQuestions[i].correct;
        const correctText = mcqQuestions[i].options[correctIdx];
        let choice = -1;
        if (selected) {
            choice = parseInt(selected.value);
            if (choice === correctIdx) {
                score++;
                fb.innerHTML = '✅ إجابتك صحيحة.';
                fb.className = 'feedback correct';
            } else {
                fb.innerHTML = '❌ إجابتك خاطئة. الإجابة الصحيحة: ' + correctText;
                fb.className = 'feedback wrong';
            }
        } else {
            fb.innerHTML = '⚠️ لم تختر إجابة. الإجابة الصحيحة: ' + correctText;
            fb.className = 'feedback wrong';
        }
        fb.style.display = 'block';
        userMcqAnswers.push(choice);
    }
    finalScore = score;

    userEssayAnswers = [];
    for (let i = 0; i < essayQuestions.length; i++) {
        const ta = document.getElementById('essay-'+i);
        userEssayAnswers.push(ta ? ta.value : '');
    }

    document.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
    document.querySelectorAll('textarea').forEach(t => t.disabled = true);
    nameInput.disabled = true;
    document.getElementById('submitBtn').disabled = true;

    // عرض النتيجة مباشرة للطالب
    document.getElementById('result').innerHTML =
        '🎯 *نتيجتك:* ' + finalScore + ' من ' + totalMcq + '<br>'
        + '📊 النسبة: ' + Math.round((finalScore/totalMcq)*100) + '%<br>'
        + (finalScore === totalMcq ? '🌟 ممتاز! أداء رائع' :
           finalScore >= totalMcq*0.7 ? '👍 جيد جداً' :
           finalScore >= totalMcq*0.5 ? '🙂 مقبول' : '📚 يحتاج مراجعة');

    document.getElementById('loadingOverlay').classList.add('active');
    document.getElementById('loadingText').textContent = 'جاري توليد PDF وإرساله للمعلم...';

    const dateStr = new Date().toLocaleString('ar-EG');
    try {
        const pdfBlob = await generatePDFBlob(studentName, dateStr);
        const ok = await sendPDFToTelegram(studentName, pdfBlob, dateStr);
        document.getElementById('loadingOverlay').classList.remove('active');
        document.getElementById('result').innerHTML += '<br>' + (ok ? '✅ تم إرسال النتيجة للمعلم بنجاح!' : '⚠️ فشل إرسال PDF (تأكد من الاتصال).');
    } catch(e) {
        console.error(e);
        document.getElementById('loadingOverlay').classList.remove('active');
        document.getElementById('result').innerHTML += '<br>⚠️ خطأ في توليد PDF.';
    }
}

document.getElementById('submitBtn').addEventListener('click', submitExam);
renderMcq();
renderEssay();
</script>
</body>
</html>
